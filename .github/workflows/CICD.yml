name: SpamShield CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  # -- POSTGRES --
  DB_DATABASE: ${{ secrets.DB_DATABASE }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_PORT: ${{ secrets.DB_PORT }}
  # -- EMAIL --
  EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
  # -- ENCRYPTION --
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  # -- MISTRAL LLM API KEY --
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  # -- BACKEND --
  BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
  # -- TESTS --
  TEST_DB_DATABASE: ${{ secrets.TEST_DB_DATABASE }}
  TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
  TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
  TEST_DB_HOST: ${{ secrets.TEST_DB_HOST }}
  TEST_DB_PORT: ${{ secrets.TEST_DB_PORT }}

  # --FRONTEND VUE--
  VITE_BACKEND_API_KEY: ${{ secrets.VITE_BACKEND_API_KEY }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # -- MLFLOW --
  MLFLOW_TRACKING_URI: http://mlflow:5050

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Creer required_metadata.json si absent
        run: |
          FILE=backend/modules/data/required_metadata.json

          if [ ! -f "$FILE" ]; then
            echo "Fichier absent, creation avec valeurs par defaut"

            mkdir -p backend/modules/data

            printf '%s\n' '{' \
              '    "name": false,' \
              '    "surname": false,' \
              '    "email": false,' \
              '    "phone": false,' \
              '    "subject": false,' \
              '    "gibberish": false' \
              '}' > "$FILE"
          else
            echo "Fichier deja present, on le garde"
          fi

      - name: Lancer la base de test
        run: docker compose -f docker-compose.test.yml up -d

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Attendre PostgreSQL
        run: |
          for i in $(seq 1 15); do
            if docker exec $(docker ps -qf "ancestor=postgres:17") pg_isready -U postgres; then
              echo "PostgreSQL est pret"
              exit 0
            fi

            echo "Attente de PostgreSQL... ($i/15)"
            sleep 2
          done

          echo "PostgreSQL n'est pas devenu disponible"
          exit 1

      - name: Lancer les tests
        run: pytest backend/tests --junitxml=results.xml

      - name: Publier les resultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

      - name: Eteindre la base de test
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Verifier la construction des images
        run: docker compose build

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Recuperer la version validee
        uses: actions/checkout@v4

      - name: Creer les fichiers env de deploiement
        shell: powershell
        run: |
          # .env BACKEND / DOCKER
          $backendEnv = @"
          DB_DATABASE=$env:DB_DATABASE
          DB_USER=$env:DB_USER
          DB_HOST=$env:DB_HOST
          DB_PASSWORD=$env:DB_PASSWORD
          DB_PORT=$env:DB_PORT
          EMAIL_ADDRESS=$env:EMAIL_ADDRESS
          EMAIL_PASSWORD=$env:EMAIL_PASSWORD
          ENCRYPTION_KEY=$env:ENCRYPTION_KEY
          MISTRAL_API_KEY=$env:MISTRAL_API_KEY
          BACKEND_API_KEY=$env:BACKEND_API_KEY
          MLFLOW_TRACKING_URI=$env:MLFLOW_TRACKING_URI
          "@

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD ".env"),
            $backendEnv
          )

          # .env FRONTEND VUE
          $frontendEnv = @"
          VITE_BACKEND_API_KEY=$env:VITE_BACKEND_API_KEY
          VITE_API_URL=$env:VITE_API_URL
          "@

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "frontend/vue-spamshield/.env"),
            $frontendEnv
          )
      - name: Creer required_metadata.json si absent
        shell: powershell
        run: |
          $file = "backend/modules/data/required_metadata.json"

          if (-not (Test-Path $file)) {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path (Split-Path $file) | Out-Null

            $metadata = [ordered]@{
              name = $false
              surname = $false
              email = $false
              phone = $false
              subject = $false
              gibberish = $false
            } | ConvertTo-Json

            [System.IO.File]::WriteAllText(
              (Join-Path $PWD $file),
              $metadata
            )

            Write-Host "required_metadata.json a ete cree"
          }
          else {
            Write-Host "required_metadata.json existe deja"
          }

      - name: Deployer SpamShield
        shell: powershell
        run: |
          docker compose down
          docker compose up --build -d
          docker compose ps