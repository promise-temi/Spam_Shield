name: SpamShield CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    
    env:
      #   -- POSTRGRES --
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}

      # -- EMAIL --
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      # -- ENCRYPTION --
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      # -- MISTRAL LLM API KEY --

      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}


      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}


      # -- TESTS -- 
      TEST_DB_DATABASE: ${{ secrets.TEST_DB_DATABASE }}
      TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DB_HOST: ${{ secrets.TEST_DB_HOST }}
      TEST_DB_PORT: ${{ secrets.TEST_DB_PORT }}
      MLFLOW_TRACKING_URI: http://mlflow:5050

    steps:
      - uses: actions/checkout@v4

      
      - name: Creer required_metadata.json si absent
        run: |
          FILE=backend/modules/data/required_metadata.json
          if [ ! -f "$FILE" ]; then
            echo "Fichier absent, creation avec valeurs par defaut (tout false)"
            mkdir -p backend/modules/data
            printf '%s\n' '{' \
              '    "name": false,' \
              '    "surname": false,' \
              '    "email": false,' \
              '    "phone": false,' \
              '    "subject": false,' \
              '    "gibberish": false' \
              '}' > "$FILE"
          else
            echo "Fichier deja present, on le garde"
          fi

      
      - name: Lancer la base de test
        run: docker compose -f docker-compose.test.yml up -d

     
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      
      - name: Attendre postgres
        run: |
          for i in $(seq 1 15); do
            if docker exec $(docker ps -qf "ancestor=postgres:17") pg_isready -U postgres; then
              echo "Postgres est pret"
              break
            fi
            echo "Attente de postgres... ($i)"
            sleep 2
          done

      
      - name: Lancer les tests
        working-directory: .
        run: pytest backend/tests --junitxml=results.xml
  
      - name: Publier les resultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

      
      # - name: Nettoyer les artefacts generes par les tests
      #   if: always()
      #   run: |
      #     rm -f backend/tests/test_ressources/model.pkl
      #     rm -f backend/tests/test_ressources/tfidf.pkl
      #     rm -f backend/tests/test_ressources/svd.pkl
      #     rm -f backend/tests/test_ressources/pca.pkl
      #     rm -f backend/tests/test_ressources/robust_scaler.pkl

      
      - name: Eteindre la base de test
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image de l'API
        run: docker build -f dockerfile.api -t spamshield-api:${{ github.sha }} .

      - name: Construire l'image du scheduler
        run: docker build -f dockerfile.scheduler -t spamshield-scheduler:${{ github.sha }} .